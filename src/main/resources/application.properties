spring.application.name=mps-erp
server.port=8080

# PostgreSQL Local (default)
spring.datasource.url=jdbc:postgresql://localhost:5432/mps_erp_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=mi-clave-secreta-para-jwt-2026
jwt.expiration=86400000

# Multi-tenant
spring.jpa.properties.hibernate.filter.auto-enabled=true

# Logging
logging.level.com.mps.erp=DEBUG
logging.level.org.springframework.security=DEBUG