version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mps-erp-postgres
    environment:
      POSTGRES_DB: mps_erp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mps-erp-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mps-erp-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mps_erp_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mps-erp-network

volumes:
  postgres_data:
    driver: local

networks:
  mps-erp-network:
    driver: bridge